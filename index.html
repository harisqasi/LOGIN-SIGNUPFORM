<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

    <div class="card">

        <h1>Welcome Back</h1>
        <p>Login to continue</p>

        <form>

            <div class="input-box">     
                 <input type="email" placeholder="Email Address" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Password" required>
            </div>

            <button class="btn" type="submit">
                Login
            </button>

            <a href="signup.html" class="btn-outline">
                Create New Account
            </a>

        </form>

    </div>

</div>

</body>
</html>
